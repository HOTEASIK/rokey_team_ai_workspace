# 공통 설정 (코드 수정 없이 이 파일만 고치고 노드 재시작)
# 단위: mm, deg, N, sec
# 키 이름 규칙: 대분류_소분류  (예: putty_scrape)

db:
  host: 127.0.0.1      # DB 서버 IP (서버 노트북)
  port: 3306
  user: cobot
  password: cobot
  database: cobot

common:
  vel: 60
  acc: 60

poses:                 # 이름: {type: joint | task, value: [...]}
  standby: {type: joint, value: [0, 0, 90, 0, 90, 0]}

force:                 # 대분류_소분류: 힘제어 파라미터
  putty_scrape:        # /process/putty 벽 도포 (BASE +X 단일 축 힘, putty_demo/action_protocol.py)
    stiffness: [3000, 3000, 3000, 200, 200, 200]
    target:    [10, 0, 0, 0, 0, 0]   # +X 10 N 이상이어야 함 (contact_search.press_force_request)
    direction: [1, 0, 0, 0, 0, 0]
    ref: 0
    mod: 0
    tol: 2.0           # contact_ratio 계산: target ± tol 안이면 접촉 유지
    wait_sec: 1.0
  putty_load:          # /process/putty_load 판 묻히기 (BASE -Z 절대 힘). null = 퍼티 팀원 확정 전 → 요청 거부됨
    tool_held_confirmed: false   # 실물: 헤라 파지를 사람이 확인한 뒤 true
    ref: 0
    mod: 0
    direction: [0, 0, 1, 0, 0, 0]
    contact_abc: [8.37, 178.03, 7.62]
    stiffness: [3000, 3000, 3000, 200, 200, 200]
    approach_height: null
    search_distance: null
    search_speed: null
    contact_force: null
    hold_force: null
    force_limit: null
    force_tolerance: null
    force_wait_timeout: null
    force_stable_time: null
    force_loss_timeout: null
    scrape_speed: null
    lift: null
    lift_speed: null
    acceleration: null

putty_load_line:       # 판 묻히기 직선 (TCP XYZ, 날 접촉 시). end = start 에서 X+30~40 (load_putty.CONTACT_POSE 기준)
  start: [-431.88, -1.52, 123.68]
  end:   [-396.88, -1.52, 123.68]

util:
  singularity: {mode: avoid, retry: 1}
  camera_up:   {z_threshold: 150}

